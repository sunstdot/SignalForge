# SignalForge Collector Configuration
#
# Copy this file to backend/config/collector.yaml and customize it locally.
# Keep private feeds, paid newsletter mirrors, and personal source lists out of
# this example file. Put those in secret/collector.yaml or another ignored file.

# Database configuration
database:
  path: ./data/tokenburner.db

# Source configuration
sources:
  # Academic papers
  arxiv:
    enabled: true
    categories:
      - cs.CL
      - cs.AI
      - cs.LG
    maxResults: 20

  # GitHub Trending
  github:
    enabled: true
    languages:
      - any
    timeRange: daily

  # AI model platforms
  models:
    enabled: true
    platforms:
      - name: "HuggingFace Trending"
        type: "huggingface"
        url: "https://huggingface.co/api/models"
        params:
          limit: 10
        category: ["ai", "models", "huggingface"]

      - name: "HuggingFace Daily Papers"
        type: "huggingface_papers"
        url: "https://huggingface.co/api/daily_papers"
        params:
          limit: 10
        category: ["ai", "papers", "huggingface"]

  # Public RSS subscriptions.
  #
  # Supported fields:
  # - name: Display name shown in collected items.
  # - type: Currently "direct" for normal RSS/Atom URLs.
  # - source_type: Optional grouping key, e.g. blog, news, smolai, wechat.
  # - url: Public RSS/Atom URL.
  # - category: Tags used by downstream briefing logic.
  # - fetchInterval: Suggested refresh interval in seconds.
  # - priority: Optional priority label.
  # - expand_topics: Optional, used by digest-style feeds.
  rss:
    enabled: true
    subscriptions:
      # AI company and lab blogs
      - name: "OpenAI Blog"
        type: "direct"
        source_type: "blog"
        url: "https://openai.com/news/rss.xml"
        category: ["ai", "openai", "official"]
        fetchInterval: 3600
        priority: "high"

      - name: "Google DeepMind Blog"
