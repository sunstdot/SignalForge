name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  github-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build release assets
        run: |
          npm pack
          sha256sum dsh-signalforge-*.tgz > SHA256SUMS
          cat SHA256SUMS

      - name: Create GitHub Release
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dsh-signalforge-*.tgz \
            SHA256SUMS \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
